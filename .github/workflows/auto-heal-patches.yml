name: 🀫 Sync Upstream & Auto-Heal Patches
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '是否强制运行补丁检测与 Gemini 自愈'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-heal-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self repo
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Check and Repair Patches via Gemini 3.7 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c '
          import os, re, glob, subprocess, sys
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")
          client = genai.Client(api_key=api_key)
          BT = "```"

          def run(cmd):
              print(f"Running: {cmd}")
              res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              if res.returncode != 0:
                  print(f"Command failed: {cmd}\nStderr: {res.stderr}")
              return res

          run("git config --global user.email actions@github.com")
          run("git config --global user.name GitHubActions")
          
          run("git remote remove upstream 2>/dev/null || true")
          
          # 使用字符串拼接防止 Markdown 自动识别为超链接加括号
          repo_url = "https://github.com/2dust/v2rayN.git"
          remote_add = run(f"git remote add upstream {repo_url}")
          if remote_add.returncode != 0:
              sys.exit(1)

          print("Fetching upstream master...")
          fetch_res = run("git fetch upstream master --depth 1")
          if fetch_res.returncode != 0:
              fetch_res = run("git fetch upstream master")
              if fetch_res.returncode != 0:
                  print("::error::Failed to fetch upstream master even after retry")
                  sys.exit(1)

          patches = sorted(glob.glob("patch/*.patch") + glob.glob("patch/*.diff"))
          if not patches:
              print("No patches found in patch/ directory.")
              sys.exit(0)

          for patch_path in patches:
              print(f"\n----------------------------------------\nChecking patch: {patch_path}")
              check_res = run(f"git apply --check --directory=. {patch_path}")
              if check_res.returncode == 0:
                  print(f"✅ Clean: {patch_path}")
                  continue

              print(f"❌ Conflict detected in {patch_path}!")
              with open(patch_path, "r", encoding="utf-8", errors="ignore") as f:
                  orig_patch = f.read()

              target_files = set()
              for line in orig_patch.splitlines():
                  if line.startswith("--- a/") or line.startswith("+++ b/"):
                      path = line[6:].strip()
                      if path and path != "/dev/null":
                          target_files.add(path)

              sources = {}
              for tf in target_files:
                  show_res = run(f"git show upstream/master:{tf}")
                  sources[tf] = show_res.stdout if show_res.returncode == 0 else "(File missing in upstream)"

              prompt = f"You are an expert Git engineer. A patch file failed to apply to upstream master.\n\n### Patch File ({patch_path}):\n{BT}diff\n{orig_patch}\n{BT}\n\n### Error:\n{check_res.stderr}\n\n### Upstream Files:\n"
              for tf, content in sources.items():
                  prompt += f"\n#### File: {tf}\n{BT}csharp\n{content}\n{BT}\n"

              prompt += "\n### Instructions:\n1. Reconstruct an UPDATED unified diff that applies to the latest upstream.\n2. Output ONLY the patch block.\n"

              print(f"Calling Gemini for {patch_path}...")
              response = client.models.generate_content(
                  model="gemini-3.7-flash",
                  contents=prompt,
                  config=types.GenerateContentConfig(thinking_config=types.ThinkingConfig(thinking_budget=2048))
              )
              
              match = re.search(r"```(?:diff|patch)?\n(.*?)\n```", response.text, re.DOTALL)
              if match:
                  with open(patch_path, "w", encoding="utf-8") as f:
                      f.write(match.group(1).strip() + "\n")
                  print(f"✨ Repaired {patch_path}")
              else:
                  print(f"::error::Failed to parse patch for {patch_path}")
          '

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "fix(patch): auto-heal patch conflicts"
          title: "🀫 [Auto-Fix] 自动修复 Patch 冲突"
          branch: "auto-fix/patch-conflicts"
          delete-branch: true
