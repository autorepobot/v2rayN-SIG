name: 🀫 Sync Upstream & Auto-Heal Patches

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      force_run:
        description: '是否强制运行补丁检测与 Gemini 自愈'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-heal-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout self repo
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check and Repair Patches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY is not configured"
            exit 1
          fi

          git config user.email "actions@github.com"
          git config user.name "GitHubActions"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/2dust/v2rayN.git

          echo "Fetching upstream/master..."
          git fetch upstream master --depth=1

          UPSTREAM_COMMIT="$(git rev-parse upstream/master)"
          echo "Upstream HEAD: $UPSTREAM_COMMIT"

          shopt -s nullglob
          PATCHES=(patch/*.patch patch/*.diff)
          shopt -u nullglob

          if (( ${#PATCHES[@]} == 0 )); then
            echo "No patches found."
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          WORKTREE="$TMP_DIR/upstream"

          cleanup() {
            git worktree remove --force "$WORKTREE" 2>/dev/null || true
            rm -rf "$TMP_DIR"
          }

          trap cleanup EXIT

          git worktree add --detach "$WORKTREE" upstream/master

          REPAIRED=0
          CONFLICTS=0

          for PATCH in "${PATCHES[@]}"; do
            echo
            echo "Checking: $PATCH"

            if git -C "$WORKTREE" apply --check --recount "$GITHUB_WORKSPACE/$PATCH"; then
              echo "✅ Clean: $PATCH"
              continue
            fi

            CONFLICTS=$((CONFLICTS + 1))

            ERROR="$(
              git -C "$WORKTREE" apply --check --recount \
                "$GITHUB_WORKSPACE/$PATCH" 2>&1 || true
            )"

            echo "❌ Conflict detected:"
            echo "$ERROR"

            FILES="$(
              grep -E '^(--- a/|\+\+\+ b/)' "$PATCH" |
              sed -E 's#^(--- a/|\+\+\+ b/)##' |
              grep -v '^/dev/null$' |
              sort -u
            )"

            if [[ -z "$FILES" ]]; then
              echo "::error::Could not detect target files in $PATCH"
              continue
            fi

            CONTEXT=""

            while IFS= read -r FILE; do
              [[ -z "$FILE" ]] && continue

              if CONTENT="$(git show "upstream/master:$FILE" 2>/dev/null)"; then
                CONTEXT+="
### File: $FILE
\`\`\`
$CONTENT
\`\`\`
"
              else
                CONTEXT+="
### File: $FILE
(File missing in upstream)
"
              fi
            done <<< "$FILES"

            PATCH_CONTENT="$(cat "$PATCH")"

            PROMPT="$(cat <<EOF
You are an expert Git engineer.

A unified diff patch failed to apply to the latest upstream/master
of the v2rayN repository.

Upstream commit:
$UPSTREAM_COMMIT

Patch file:
$PATCH

Original patch:
\`\`\`diff
$PATCH_CONTENT
\`\`\`

git apply --check error:
\`\`\`
$ERROR
\`\`\`

Relevant files from latest upstream/master:
$CONTEXT

Instructions:
1. Reconstruct an updated unified diff that applies cleanly to latest upstream/master.
2. Preserve the original intent of the patch.
3. Do not introduce unrelated changes.
4. Output ONLY the unified diff.
EOF
)"

            echo "🤖 Calling Gemini..."

            REQUEST="$(
              jq -n \
                --arg prompt "$PROMPT" \
                '{
                  contents: [
                    {
                      parts: [
                        {
                          text: $prompt
                        }
                      ]
                    }
                  ]
                }'
            )"

            RESPONSE="$(
              curl -fsS \
                -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$REQUEST"
            )"

            TEXT="$(
              jq -r '.candidates[0].content.parts[0].text // empty' \
                <<< "$RESPONSE"
            )"

            if [[ -z "$TEXT" ]]; then
              echo "::error::Gemini returned no usable response"
              echo "$RESPONSE"
              continue
            fi

            REPAIRED_PATCH="$(
              printf '%s\n' "$TEXT" |
              sed -n '/^```\(diff\|patch\)\?$/,/^```$/p' |
              sed '1d;$d'
            )"

            if [[ -z "$REPAIRED_PATCH" ]]; then
              echo "::error::Failed to parse Gemini patch"
              echo "$TEXT"
              continue
            fi

            CANDIDATE="$TMP_DIR/$(basename "$PATCH").gemini"
            printf '%s\n' "$REPAIRED_PATCH" > "$CANDIDATE"

            echo "Validating Gemini patch..."

            if ! VALIDATION_ERROR="$(
              git -C "$WORKTREE" apply --check --recount "$CANDIDATE" 2>&1
            )"; then
              echo "❌ Gemini repair failed validation:"
              echo "$VALIDATION_ERROR"
              echo "⚠️ Original patch was left untouched."
              continue
            fi

            cp "$CANDIDATE" "$PATCH"
            REPAIRED=$((REPAIRED + 1))

            echo "✨ Repaired: $PATCH"
          done

          echo
          echo "Total patches : ${#PATCHES[@]}"
          echo "Conflicts     : $CONFLICTS"
          echo "Repaired      : $REPAIRED"

      - name: Show Changes
        run: |
          git status --short
          echo
          git diff -- patch/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "fix(patch): auto-heal patch conflicts"
          title: "🀫 [Auto-Fix] 自动修复 Patch 冲突"
          body: |
            Automatically repaired patches that no longer apply
            cleanly to upstream/master.

            Validation flow:
            1. Check against upstream/master
            2. Call Gemini only on conflict
            3. Validate Gemini output
            4. Submit only validated repairs
          branch: "auto-fix/patch-conflicts"
          delete-branch: true
