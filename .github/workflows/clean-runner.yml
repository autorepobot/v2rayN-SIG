name: 🀫 Cleanup Completed Runs

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: '每个 workflow 保留最近多少条已完成记录（0 表示全部删除）'
        type: number
        default: 0
  schedule:
    - cron: '0 3 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_LATEST: ${{ github.event.inputs.keep_latest || '0' }}
        run: |
          set -euo pipefail

          echo "Repository: $REPO"
          echo "Keep latest per workflow: $KEEP_LATEST"

          declare -A WORKFLOW_FILES
          while IFS= read -r file; do
            WORKFLOW_FILES["$file"]=1
          done < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')

          RUNS_JSON=$(mktemp)
          gh api \
            --paginate \
            "repos/$REPO/actions/runs?status=completed&per_page=100" \
            | jq -s '{workflow_runs: [.[].workflow_runs[]]}' > "$RUNS_JSON"

          TOTAL_DELETED=0

          while IFS= read -r run; do
            RUN_ID=$(jq -r '.id' <<< "$run")
            RUN_PATH=$(jq -r '.path // empty' <<< "$run")

            if [[ -z "${WORKFLOW_FILES[$RUN_PATH]+x}" ]]; then
              echo "Deleting orphan run $RUN_ID ($RUN_PATH)"
              if gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID" --silent; then
                TOTAL_DELETED=$((TOTAL_DELETED + 1))
              else
                echo "::warning::Failed to delete run $RUN_ID"
              fi
            fi
          done < <(jq -c '.workflow_runs[]' "$RUNS_JSON")

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            RUNS=$(jq -c \
              --arg path "$path" \
              '[.workflow_runs[] | select(.path == $path)] | sort_by(.created_at) | reverse' \
              "$RUNS_JSON")

            COUNT=$(jq 'length' <<< "$RUNS")
            echo "Workflow: $path"
            echo "Completed runs: $COUNT"

            if [ "$KEEP_LATEST" -gt 0 ]; then
              RUNS_TO_DELETE=$(jq -c --argjson keep "$KEEP_LATEST" '.[$keep:][]' <<< "$RUNS")
            else
              RUNS_TO_DELETE=$(jq -c '.[]' <<< "$RUNS")
            fi

            while IFS= read -r run; do
              [ -n "$run" ] || continue
              RUN_ID=$(jq -r '.id' <<< "$run")

              echo "Deleting run $RUN_ID"
              if gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID" --silent; then
                TOTAL_DELETED=$((TOTAL_DELETED + 1))
              else
                echo "::warning::Failed to delete run $RUN_ID"
              fi
            done <<< "$RUNS_TO_DELETE"
          done < <(printf '%s\n' "${!WORKFLOW_FILES[@]}")

          echo "----"
          echo "Total deleted: $TOTAL_DELETED"
