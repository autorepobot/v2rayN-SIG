name: Cleanup GitHub Runners Disable

on:
  workflow_dispatch:

jobs:
  cleanup-runners:
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: Disable and delete all self-hosted runners
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Fetching all self-hosted runners..."

          # 获取所有 runner ID
          RUNNERS=$(gh api \
            --method GET \
            /repos/${{ github.repository }}/actions/runners \
            --jq '.runners[].id')

          if [ -z "$RUNNERS" ]; then
            echo "No self-hosted runners found."
            exit 0
          fi

          for RUNNER_ID in $RUNNERS; do
            echo "Disabling runner: $RUNNER_ID"

            # 先关闭 runner
            gh api \
              --method POST \
              /repos/${{ github.repository }}/actions/runners/$RUNNER_ID/disable

            echo "Deleting runner: $RUNNER_ID"

            # 再删除 runner
            gh api \
              --method DELETE \
              /repos/${{ github.repository }}/actions/runners/$RUNNER_ID
          done

          echo "All runners disabled and deleted."
