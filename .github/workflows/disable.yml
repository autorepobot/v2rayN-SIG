name: 🀫 Manage Workflow and Runner

on:
  workflow_dispatch:
    inputs:
      home_disable:
        description: "主页区域：禁用普通 workflow (.yml -> .yml.disable)"
        required: false
        type: boolean
        default: false

      home_restore:
        description: "主页区域：恢复 workflow (.disable -> .yml)"
        required: false
        type: boolean
        default: false

      runner_disable:
        description: "Runner区域：Disable 所有 self-hosted runner"
        required: false
        type: boolean
        default: false

      runner_delete:
        description: "Runner区域：删除所有 self-hosted runner"
        required: false
        type: boolean
        default: false

      restore_disable:
        description: "恢复所有 .disable 文件"
        required: false
        type: boolean
        default: false


permissions:
  contents: write
  actions: write


jobs:

  manage:
    name: Manage Workflow / Runner
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}


      ##################################
      # Home workflow disable
      ##################################

      - name: Disable home workflows
        if: inputs.home_disable
        run: |
          echo "Disable non-SIG files with SIG counterpart"

          cd .github/workflows

          # Disable yml files when xxx-sig.yml exists
          for sig in *-sig.yml; do
            if [ -f "$sig" ]; then
              normal="${sig/-sig.yml/.yml}"

              if [ -f "$normal" ]; then
                echo "Disable $normal"
                mv "$normal" "$normal.disable"
              fi
            fi
          done

          cd ../..

          # Disable sh files when xxx-sig.sh exists
          for sig in *-sig.sh; do
            if [ -f "$sig" ]; then
              normal="${sig/-sig.sh/.sh}"

              if [ -f "$normal" ]; then
                echo "Disable $normal"
                mv "$normal" "$normal.disable"
              fi
            fi
          done


      ##################################
      # Restore workflow
      ##################################

      - name: Restore workflows
        if: inputs.home_restore || inputs.restore_disable
        run: |
          echo "Restore non-SIG files with SIG counterpart"

          cd .github/workflows

          # Restore yml files only if xxx-sig.yml exists
          for f in *.yml.disable; do
            if [ -f "$f" ]; then
              normal="${f%.disable}"
              sig="${normal/.yml/-sig.yml}"

              if [ -f "$sig" ]; then
                echo "Restore $normal"
                mv "$f" "$normal"
              else
                echo "Skip $f (no SIG counterpart)"
              fi
            fi
          done

          cd ../..

          # Restore sh files only if xxx-sig.sh exists
          for f in *.sh.disable; do
            if [ -f "$f" ]; then
              normal="${f%.disable}"
              sig="${normal/.sh/-sig.sh}"

              if [ -f "$sig" ]; then
                echo "Restore $normal"
                mv "$f" "$normal"
              else
                echo "Skip $f (no SIG counterpart)"
              fi
            fi
          done


      ##################################
      # Disable runners
      ##################################

      - name: Disable runners
        if: inputs.runner_disable
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |

          echo "Find runners"

          RUNNERS=$(gh api \
          repos/${{ github.repository }}/actions/runners \
          --jq '.runners[].id')


          for id in $RUNNERS
          do
            echo "Disable runner $id"

            gh api \
            --method POST \
            repos/${{ github.repository }}/actions/runners/$id/disable || true

          done


      ##################################
      # Delete runners
      ##################################

      - name: Delete runners
        if: inputs.runner_delete
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |

          echo "Find runners"

          RUNNERS=$(gh api \
          repos/${{ github.repository }}/actions/runners \
          --jq '.runners[].id')


          for id in $RUNNERS
          do
            echo "Delete runner $id"

            gh api \
            --method DELETE \
            repos/${{ github.repository }}/actions/runners/$id || true

          done


      ##################################
      # Commit changes
      ##################################

      - name: Commit workflow changes
        if: inputs.home_disable || inputs.home_restore || inputs.restore_disable
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Manage workflow disable files" || echo "No changes"

          git push
